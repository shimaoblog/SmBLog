<!DOCTYPE html>
<html lang="cmn-Hans">
<head>
{{global_head}}
<title>{{post_title}} | {{site_title}}</title>
</head>
<body>
<div class="container">
  <header>
    <div class="header-inner">
      <div class="site-info">
        <h1><a href="{{base}}index.html">{{site_title}}</a></h1>
      </div>
      <button class="theme-toggle" aria-label="切换主题">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
    <nav class="nav">
      {{nav}}
    </nav>
  </header>

  <main>
    <article>
      <h1 class="post-title">{{post_title}}</h1>
      <div class="post-meta">
        <i class="fa-regular fa-calendar"></i> {{post_date}}
      </div>
      <div class="post-content markdown-body">
        {{post_content}}
      </div>
      <!-- Twikoo评论区 -->
      <div id="tcomment" style="margin-top:3rem;"></div>
      <script src="https://cdn.jsdelivr.net/npm/twikoo@1.7.11/dist/twikoo.all.min.js"></script>
      <script>
twikoo.init({
  envId: 'https://twikoo-minima.netlify.app/api',
  el: '#tcomment',
  lang: 'zh-CN',
  path: window.location.pathname.replace(/\/index\.html$/, '')
});
      </script>
    </article>
  </main>

  <div class="footer-bar">
    <a class="view-link" href="{{base}}index.html">
      <i class="fa-solid fa-arrow-left view-icon"></i>返回首页
    </a>
    <footer>© {{author}}</footer>
  </div>
</div>
<script src="{{base}}JS/main.js"></script>
</body>
</html>
